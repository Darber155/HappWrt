name: debug-logs

on:
  workflow_run:
    workflows: [ build ]
    types: [ completed ]

jobs:
  publish:
    name: publish failed build logs
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Fetch failed logs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run view ${{ github.event.workflow_run.id }} --log-failed > failed.log 2>&1 || \
            gh run view ${{ github.event.workflow_run.id }} --log > failed.log 2>&1 || true
          wc -l failed.log || true

      - name: Publish logs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view debug-logs >/dev/null 2>&1 || \
            gh release create debug-logs --title "debug logs" --notes "failed build logs"
          cp failed.log debug-logs-failed.log
          gh release upload debug-logs debug-logs-failed.log --clobber
