name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ucode tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libjson-c-dev git

      - name: Build ucode
        run: |
          git clone --depth 1 https://github.com/jow-/ucode.git /tmp/ucode
          cmake -S /tmp/ucode -B /tmp/ucode/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/ucode/build -j"$(nproc)"
          sudo cmake --install /tmp/ucode/build
          sudo ldconfig
          ucode -e 'print(1 + 1, "\n")'

      - name: Run tests
        run: |
          chmod +x tests/run_tests.sh
          tests/run_tests.sh

  build:
    name: build apk (mipsel_24kc)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build packages
        uses: openwrt/gh-action-sdk@main
        env:
          CONTAINER: openwrt/sdk
          ARCH: ramips-mt7621-25.12.5
          PACKAGES: happwrt luci-app-happwrt
          FEEDNAME: happwrt
          INDEX: 0
          NO_SHFMT_CHECK: 1

      - name: Publish build logs on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf build-logs.tar.gz logs 2>/dev/null || true
          gh release view debug-logs >/dev/null 2>&1 || \
            gh release create debug-logs --title "debug logs" --notes "build diagnostics"
          if [ -f build-logs.tar.gz ]; then
            gh release upload debug-logs build-logs.tar.gz --clobber
          else
            echo "no logs directory found" > build-logs.tar.gz
            gh release upload debug-logs build-logs.tar.gz --clobber
          fi

      - name: Locate artifacts
        run: find bin -type f \( -name '*.apk' -o -name '*.ipk' \) -print || true

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: happwrt-mipsel_24kc
          path: |
            bin/packages/mipsel_24kc/**/*.apk
            bin/packages/mipsel_24kc/**/*.ipk
          if-no-files-found: error

  release:
    name: publish release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: happwrt-mipsel_24kc
          path: dist

      - name: Collect packages
        run: |
          mkdir -p release
          find dist -type f -name 'happwrt-*.apk' -exec cp {} release/happwrt.apk \;
          find dist -type f -name 'luci-app-happwrt-*.apk' -exec cp {} release/luci-app-happwrt.apk \;
          find dist -type f -name 'happwrt-*.ipk' -exec cp {} release/happwrt.ipk \;
          find dist -type f -name 'luci-app-happwrt-*.ipk' -exec cp {} release/luci-app-happwrt.ipk \;
          ls -la release

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "latest" --notes "Automatic build of HappWRT packages"
          gh release upload latest release/* --clobber
